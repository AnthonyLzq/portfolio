<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Extend Images logo">
  <defs>
    <linearGradient id="ei-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55b9ff"/>
      <stop offset="0.5" stop-color="#1a66f0"/>
      <stop offset="1" stop-color="#0b46c4"/>
    </linearGradient>
    <clipPath id="ei-clip">
      <rect x="48" y="115" width="100" height="360" rx="48"/>
      <rect x="48" y="115" width="264" height="90" rx="45"/>
      <rect x="48" y="251" width="264" height="90" rx="45"/>
      <rect x="48" y="387" width="264" height="90" rx="45"/>
      <rect x="352" y="115" width="68" height="360" rx="34"/>
    </clipPath>
    <filter id="ei-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#2b7fff" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#ei-glow)">
    <g fill="url(#ei-grad)">
      <rect x="48" y="115" width="100" height="360" rx="48"/>
      <rect x="48" y="115" width="264" height="90" rx="45"/>
      <rect x="48" y="251" width="264" height="90" rx="45"/>
      <rect x="48" y="387" width="264" height="90" rx="45"/>
      <rect x="352" y="115" width="68" height="360" rx="34"/>
    </g>
    <g clip-path="url(#ei-clip)">
      <polygon points="120,0 340,0 140,512 -80,512" fill="#ffffff" opacity="0.14"/>
      <polygon points="330,0 420,0 220,512 130,512" fill="#9bd4ff" opacity="0.10"/>
    </g>
  </g>
</svg>
